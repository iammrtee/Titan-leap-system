<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TitanLeap | Growth System</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      // Catch extension ready message in case it fires before React has mounted
      window.__EXT_READY__ = false;
      window.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'TITANLEAP_EXTENSION_READY') {
          window.__EXT_READY__ = true;
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
